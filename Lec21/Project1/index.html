<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .container {
            display: flex;

        }

        .box1 {
            width: 20vw;
            border: 2px solid black;
            height: 100vh;
            background-color: aqua;

        }

        .box2 {
            width: 65vw;
            height: 100vh;
            border: 2px solid black;
            background-color: bisque;

        }

        .box3 {
            width: 15vw;
            height: 100vh;
            border: 2px solid black;
            background-color: chartreuse;

        }

        .innerbox {
            margin: auto;
            width: 90%;
            height: 25%;
            margin-top: 20px;
            border: 2px solid black;
        }

        /*tablet*/

        @media (min-width:700px) and (max-width:1024px) {
            .container {
                display: flex;
                flex-wrap: wrap;
                gap: 5%;
                justify-content: center;
            }

            .box3 {
                width: 95vw;
                height: 200px;
                margin: auto;
                margin-top: 100px;
            }
        }

        @media (max-width:699px) {
            .box1 {
                width: 90vw;
                height: 20vh;
            }

            .box2 {
                width: 90vw;
                height: 70vh;
            }

            .box3 {
                width: 90vw;
                height: 10vh;

            }

            .container {
                display: flex;
                flex-direction: column;
                justify-content: space-between
            }
        }
    </Style>
</head>

<body>

    <div class="container">
        <div class="box1"></div>
        <div class="box2">
            <div class="innerbox"></div>
            <div class="innerbox"></div>
            <div class="innerbox"></div>
        </div>
        <div class="box3"></div>
    </div>
</body>

</html>
